<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shop Visit Checklist</title>
<meta name="theme-color" content="#0F2233">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Visit Checklist">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root { color-scheme: light; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; font: 14px system-ui, sans-serif; }
img { max-width: 100%; }
[hidden] { display: none !important; }
</style>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600&display=swap">
<style>
/* Layout: one narrow column for a phone held in one hand. Three views: visit list, one visit's checklist with a note and camera on every point, export. */
:root {
  --bg: #F2F5F8;
  --surface: #FFFFFF;
  --ink: #0F2233;
  --muted: #5B6B7A;
  --line: #DCE3EA;
  --accent: #14649C;
  --accent-ink: #FFFFFF;
  --flag: #F2B632;
  --flag-ink: #3A2A00;
  --done: #E9F2F8;
  --field: #F7F9FB;
  --danger: #B3261E;
  --ok: #1E7B4F;
  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "Figtree", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0B1722; --surface: #12212F; --ink: #E7EEF5; --muted: #93A4B4; --line: #223648;
    --accent: #5AB0E8; --accent-ink: #06202F; --flag: #E8B13A; --flag-ink: #2A1E00; --done: #163044; --field: #0E1B27;
    --danger: #F2837B; --ok: #62C48F;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0B1722; --surface: #12212F; --ink: #E7EEF5; --muted: #93A4B4; --line: #223648;
  --accent: #5AB0E8; --accent-ink: #06202F; --flag: #E8B13A; --flag-ink: #2A1E00; --done: #163044; --field: #0E1B27;
  --danger: #F2837B; --ok: #62C48F;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 16px; line-height: 1.4;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 56px;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.wrap { max-width: 640px; margin: 0 auto; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--flag); outline-offset: 2px; }

/* header */
header { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding: 12px 0; border-bottom: 1px solid var(--line); }
.top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.kicker { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
h1 { font-family: var(--font-display); font-size: 24px; line-height: 1.12; margin: 2px 0 0; letter-spacing: -.01em; overflow-wrap: anywhere; }
.vmeta { color: var(--muted); font-size: 14px; margin-top: 2px; overflow-wrap: anywhere; }
.back { background: none; border: 0; color: var(--accent); font-weight: 600; padding: 4px 0 8px; min-height: 36px; cursor: pointer; }
.chip { flex: none; font-size: 12px; font-weight: 600; padding: 5px 9px; border-radius: 99px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); white-space: nowrap; }
.chip.ok { color: var(--ok); border-color: var(--ok); }
.chip.error { color: var(--danger); border-color: var(--danger); }
.prog { display: flex; align-items: center; gap: 12px; margin-top: 10px; }
.bar { flex: 1; height: 8px; background: var(--line); border-radius: 99px; overflow: hidden; }
.bar > i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: 99px; transition: width .25s ease; }
.count { font-variant-numeric: tabular-nums; font-weight: 600; font-size: 14px; white-space: nowrap; }

/* shared controls */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 10px 18px; border-radius: 12px; font-weight: 600; cursor: pointer; border: 1.5px solid var(--accent); background: transparent; color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); }
.btn.danger { border-color: var(--danger); color: var(--danger); }
.btn.block { width: 100%; }
.btn[disabled] { opacity: .5; cursor: default; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-top: 12px; }
.card h2 { font-family: var(--font-display); font-size: 18px; margin: 0 0 10px; }
.field { display: flex; flex-direction: column; gap: 5px; margin-top: 12px; min-width: 0; }
.field:first-of-type { margin-top: 0; }
.field label, .lab { font-size: 13px; font-weight: 600; color: var(--muted); }
input[type=text], input[type=date], select, textarea {
  font: inherit; font-size: 16px; color: var(--ink); background: var(--field); border: 1.5px solid var(--line); border-radius: 10px; padding: 11px 12px; width: 100%; min-width: 0;
}
input[type=text]:focus, input[type=date]:focus, select:focus, textarea:focus { border-color: var(--accent); outline: none; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 14px; }
.hint { color: var(--muted); font-size: 14px; margin: 8px 0 0; }
.who { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.who b { overflow-wrap: anywhere; }
.link { background: none; border: 0; color: var(--accent); font-weight: 600; cursor: pointer; padding: 8px 0; min-height: 40px; }

/* visit list */
.vlist { display: flex; flex-direction: column; gap: 10px; margin-top: 12px; padding: 0; list-style: none; }
.vcard { width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 13px 14px; cursor: pointer; display: block; }
.vcard b { font-family: var(--font-display); font-size: 17px; display: block; overflow-wrap: anywhere; }
.vcard span.m { color: var(--muted); font-size: 14px; display: block; margin-top: 2px; overflow-wrap: anywhere; }
.vcard .mini { display: flex; align-items: center; gap: 10px; margin-top: 10px; font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; }
.empty { margin-top: 18px; padding: 22px 16px; text-align: center; color: var(--muted); border: 1.5px dashed var(--line); border-radius: 14px; }

/* checklist */
.intro { margin: 14px 0 0; color: var(--muted); font-size: 14px; }
.sec { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; margin-top: 12px; overflow: hidden; }
summary { list-style: none; display: flex; align-items: center; gap: 12px; padding: 14px; cursor: pointer; min-height: 56px; }
summary::-webkit-details-marker { display: none; }
.badge { flex: none; width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; font-family: var(--font-display); font-weight: 700; font-size: 15px; background: var(--done); color: var(--accent); }
.sec.focus .badge { background: var(--flag); color: var(--flag-ink); }
.stitle { flex: 1; min-width: 0; }
.stitle b { font-family: var(--font-display); font-size: 17px; font-weight: 600; display: block; line-height: 1.2; }
.stitle em { font-style: normal; font-size: 12px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--flag-ink); background: var(--flag); padding: 2px 7px; border-radius: 6px; display: inline-block; margin-top: 4px; }
.scount { font-variant-numeric: tabular-nums; font-size: 14px; font-weight: 600; color: var(--muted); }
.scount.full { color: var(--accent); }
.chev { flex: none; width: 10px; height: 10px; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: rotate(45deg); transition: transform .15s; margin: 0 4px 3px 0; }
details[open] > summary .chev { transform: rotate(-135deg); margin: 3px 4px 0 0; }
.list { border-top: 1px solid var(--line); }
.item { padding: 12px 14px 14px; border-bottom: 1px solid var(--line); }
.item:last-child { border-bottom: 0; }
.item.on { background: var(--done); }
.row { display: flex; gap: 14px; align-items: flex-start; cursor: pointer; -webkit-tap-highlight-color: transparent; min-height: 40px; }
.row input { appearance: none; -webkit-appearance: none; flex: none; width: 26px; height: 26px; margin: 1px 0 0; border: 2px solid var(--muted); border-radius: 7px; background: transparent; cursor: pointer; display: grid; place-items: center; }
.row input::after { content: ""; width: 7px; height: 13px; border-right: 3px solid var(--accent-ink); border-bottom: 3px solid var(--accent-ink); transform: rotate(45deg) translate(-1px, -1px) scale(0); transition: transform .12s ease; }
.row input:checked { background: var(--accent); border-color: var(--accent); }
.row input:checked::after { transform: rotate(45deg) translate(-1px, -1px) scale(1); }
.txt { min-width: 0; }
.txt b { font-weight: 600; display: block; }
.txt small { display: block; color: var(--muted); font-size: 14px; margin-top: 2px; }
.noterow { display: flex; gap: 8px; align-items: flex-start; margin: 8px 0 0 40px; }
.noterow textarea { flex: 1; resize: none; overflow: hidden; min-height: 44px; line-height: 1.35; padding: 10px 12px; }
.cam { flex: none; width: 44px; height: 44px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--field); color: var(--accent); display: grid; place-items: center; cursor: pointer; }
.cam svg { width: 22px; height: 22px; }
.thumbs { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0 0 40px; }
.thumbs:empty { display: none; }
.thumb { width: 64px; height: 64px; border-radius: 10px; border: 1px solid var(--line); background: var(--field) center / cover no-repeat; cursor: pointer; padding: 0; display: grid; place-items: center; color: var(--muted); font-size: 11px; }
.tools { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
.tools .btn { padding: 8px 6px; font-size: 15px; min-width: 0; text-align: center; line-height: 1.2; }
.tools.two { grid-template-columns: 1fr 1fr; }
.dest { text-align: left; background: var(--field); border: 1.5px solid var(--line); border-radius: 12px; padding: 12px 14px; cursor: pointer; display: block; width: 100%; }
.dest b { display: block; color: var(--accent); }
.dest small { display: block; color: var(--muted); font-size: 13px; margin-top: 3px; }
.msg { color: var(--danger); font-size: 14px; margin: 10px 0 0; }

/* export */
.pick { display: flex; flex-direction: column; gap: 4px; }
.pick label { display: flex; gap: 10px; align-items: flex-start; padding: 10px 0; min-height: 44px; cursor: pointer; border-bottom: 1px solid var(--line); }
.pick label:last-child { border-bottom: 0; }
.pick input { width: 22px; height: 22px; margin: 1px 0 0; accent-color: var(--accent); flex: none; }
.pick span { min-width: 0; overflow-wrap: anywhere; }
.pick small { display: block; color: var(--muted); font-size: 13px; }

/* photo viewer + toast */
.viewer { position: fixed; inset: 0; z-index: 30; background: rgba(5, 12, 18, .94); display: flex; flex-direction: column; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); gap: 12px; }
.viewer img { flex: 1; min-height: 0; width: 100%; object-fit: contain; }
.viewer .vb { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
.viewer .btn { color: #fff; border-color: #fff; }
.viewer .btn.danger { color: #FFB4AB; border-color: #FFB4AB; }
.toast { position: fixed; left: 50%; bottom: max(20px, env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 14px; font-weight: 600; z-index: 80; max-width: calc(100% - 32px); text-align: center; }
a.btn { text-decoration: none; }
.vrow { display: flex; gap: 8px; align-items: stretch; }
.vrow .vcard { flex: 1; min-width: 0; }
.sharebtn { flex: none; width: 64px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface); color: var(--accent); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12px; font-weight: 600; cursor: pointer; }
.sharebtn svg { width: 22px; height: 22px; }
.pill { display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--ok); border: 1px solid var(--ok); border-radius: 6px; padding: 1px 6px; margin-left: 8px; vertical-align: middle; }
.sheet { position: fixed; inset: 0; z-index: 50; background: rgba(5, 12, 18, .6); display: flex; align-items: flex-end; justify-content: center; }
.sheetbox { background: var(--surface); width: 100%; max-width: 640px; max-height: 92%; overflow-y: auto; border-radius: 18px 18px 0 0; padding: 18px max(16px, env(safe-area-inset-right, 0px)) max(18px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.sheetbox h2 { font-family: var(--font-display); font-size: 19px; margin: 0 0 8px; }
.sheetbox textarea { font-size: 14px; resize: vertical; }
.stack { display: flex; flex-direction: column; gap: 10px; margin-top: 12px; }
.chk { display: flex; gap: 10px; align-items: center; margin-top: 14px; min-height: 40px; cursor: pointer; }
.chk input { width: 22px; height: 22px; accent-color: var(--accent); }
.foot { margin-top: 22px; color: var(--muted); font-size: 13px; }
@media (max-width: 380px) { .two { grid-template-columns: 1fr; } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>


<div class="wrap">
  <header id="hdr"></header>
  <main id="app"></main>
</div>
<div class="viewer" id="viewer" hidden></div>
<div class="sheet" id="sheet" hidden></div>
<div class="toast" id="toast" hidden></div>
<input type="file" id="file" accept="image/*" multiple hidden>

<script>
/* ---------- checklist content ---------- */
var DATA = [
  { id: "A", title: "Fashion trend & design", focus: true, items: [
    ["Colors", "Trending colors and color pairings"],
    ["Fit & silhouette", "Cuts, lengths, oversized vs tailored"],
    ["Fabric & details", "Fabrics, prints, patterns, embroidery, trims"],
    ["Collection story", "Season or festival theme; how the range is edited"],
    ["Complete looks", "Layering, accessories, footwear and bags styled together"],
    ["Street style", "What local people and visitors are really wearing"],
    ["Price vs design", "What looks premium at its price"],
    ["Fit for Bangladesh", "Which ideas suit our customers, climate and occasions"]
  ]},
  { id: "B", title: "Window & entrance", items: [
    ["First impression", "What makes you stop and look from a distance?"],
    ["Window story", "One clear theme, few products, one message"],
    ["Mannequin styling", "Full looks, poses, color blocking"],
    ["Entrance", "Welcoming; offers or new arrivals visible at the door"]
  ]},
  { id: "C", title: "In-store display (VM)", items: [
    ["Product grouping", "By category, color, size or complete look"],
    ["Color blocking & rhythm", "How walls and racks are balanced"],
    ["Focal points", "Mannequins, feature tables, hero products"],
    ["Folding, hanging & spacing", "Neat, consistent, easy to pick up"],
    ["Zones", "New arrival, premium and sale areas clearly separate"],
    ["Promo display & signage", "Simple, readable, not crowded"],
    ["Lighting on products", "Spotlights, warm vs cool, no dark corners"]
  ]},
  { id: "D", title: "Layout & customer flow", items: [
    ["Where the eye goes first", "Entry zone, feature wall, route through the store"],
    ["Walking space", "Aisle width, no blocked corners"],
    ["Reach & visibility", "Best products at eye and hand level"],
    ["Fixtures & materials", "Simple, flexible, low-cost ideas we can copy"]
  ]},
  { id: "E", title: "Making buying easy", focus: true, items: [
    ["Easy to find", "Signs, size guides, clear sections"],
    ["Easy to choose", "Tags show fabric, fit, price and care at a glance"],
    ["Self-service", "Customers pick up, touch and try freely"],
    ["Styling help", "“Complete the look” displays and matching suggestions"],
    ["Add-ons at the point of choice", "Accessories and small items near the clothes"],
    ["Offers explained clearly", "Visible, simple, not confusing"],
    ["Price tags & labels", "Clear, consistent, trustworthy"],
    ["Sizes", "How sizes are shown; how staff bring another size"],
    ["Exchange & return message", "Visible reassurance for the customer"],
    ["Membership or loyalty offer", "Promoted at the counter or on signs"]
  ]},
  { id: "F", title: "Staff & service", items: [
    ["Greeting", "Timing and tone; welcome without pressure"],
    ["Helping without hovering", "How close staff stay; when they step in"],
    ["Product knowledge", "Ask one question and see how they answer"],
    ["Grooming & body language", "Uniform, posture, smile"],
    ["Suggesting a second item", "How they add to the sale politely"]
  ]},
  { id: "G", title: "Fitting room & checkout", items: [
    ["Fitting room", "Clean, well lit, mirror, hooks, privacy, size-swap help"],
    ["Queue & billing", "Speed, calm handling, payment options"],
    ["Packaging & farewell", "Bag, tissue, branding, how it is handed over"]
  ]},
  { id: "H", title: "Atmosphere & brand feel", items: [
    ["Cleanliness", "Floor, glass, racks, corners"],
    ["Music, scent & temperature", "How the space feels"],
    ["Brand consistency", "Colors, fonts, bags, uniform feel like one brand"],
    ["Digital touchpoints", "QR codes, social media, screens"],
    ["Photo-worthy corner", "A feature that makes shoppers take pictures"]
  ]},
  { id: "I", title: "Beyond fashion: hotels, restaurants, local shops", items: [
    ["Hotel welcome", "First 30 seconds, small thoughtful touches, speed"],
    ["Hotel ambience", "Lobby lighting, scent, layout"],
    ["Restaurant presentation", "How menus and food are shown; combo or set offers"],
    ["Waiting & queues", "How people are kept comfortable while they wait"],
    ["Local or night market", "How vendors call, talk and display on a small budget"]
  ]},
  { id: "J", title: "Before you leave", items: [
    ["Best thing to copy at Sailor", "One idea you would bring home"],
    ["One thing to avoid", "Something that did not work"],
    ["Anything else worth sharing", "For your presentation"]
  ]}
];
var TYPES = ["Brand store", "Mall store", "Local shop", "Street / night market", "Hotel", "Restaurant / café", "Other"];
var ITEM = {}, TOTAL = 0;
DATA.forEach(function (s) { s.items.forEach(function (it, i) { ITEM[s.id + (i + 1)] = { sec: s, title: it[0], hint: it[1] }; TOTAL++; }); });

/* ---------- helpers ---------- */
function $(s, r) { return (r || document).querySelector(s); }
function $$(s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); }
function esc(t) { return String(t == null ? "" : t).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
function today() { var d = new Date(); return d.getFullYear() + "-" + ("0" + (d.getMonth() + 1)).slice(-2) + "-" + ("0" + d.getDate()).slice(-2); }
function fmtDate(s) { var p = (s || "").split("-"); if (p.length !== 3) return s || ""; return new Date(+p[0], +p[1] - 1, +p[2]).toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" }); }
function slug(t) { return String(t || "file").replace(/[^A-Za-z0-9]+/g, "_").replace(/^_+|_+$/g, "").slice(0, 40) || "file"; }
var toastTimer;
function toast(msg) { var t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.hidden = true; }, 2600); }

/* ---------- local store (IndexedDB, with in-memory fallback) ---------- */
var S = { view: "home", visits: [], cur: null, urls: {}, profile: { name: "", branch: "" }, open: { A: 1 }, formOpen: false, editProfile: false, editDetails: false, confirmDelete: false, sync: "off", memoryOnly: false, ex: null };
var store = (function () {
  var db = null, mem = { visits: {}, blobs: {} };
  function req(r) { return new Promise(function (res, rej) { r.onsuccess = function () { res(r.result); }; r.onerror = function () { rej(r.error); }; }); }
  function tx(name, mode) { return db.transaction(name, mode).objectStore(name); }
  return {
    init: function () {
      return new Promise(function (res) {
        try {
          var o = indexedDB.open("sailor-th-shop-visits", 2);
          o.onupgradeneeded = function () { var d = o.result; if (!d.objectStoreNames.contains("visits")) d.createObjectStore("visits", { keyPath: "id" }); if (!d.objectStoreNames.contains("blobs")) d.createObjectStore("blobs"); if (!d.objectStoreNames.contains("meta")) d.createObjectStore("meta"); };
          o.onsuccess = function () { db = o.result; res(); };
          o.onerror = function () { S.memoryOnly = true; res(); };
          o.onblocked = function () { S.memoryOnly = true; res(); };
        } catch (e) { S.memoryOnly = true; res(); }
      });
    },
    all: function () { if (!db) return Promise.resolve(Object.keys(mem.visits).map(function (k) { return mem.visits[k]; })); return req(tx("visits").getAll()).catch(function () { return []; }); },
    put: function (v) { if (!db) { mem.visits[v.id] = JSON.parse(JSON.stringify(v)); return Promise.resolve(); } return req(tx("visits", "readwrite").put(JSON.parse(JSON.stringify(v)))).catch(function () {}); },
    del: function (id) { if (!db) { delete mem.visits[id]; return Promise.resolve(); } return req(tx("visits", "readwrite").delete(id)).catch(function () {}); },
    putBlob: function (id, b) { if (!db) { mem.blobs[id] = b; return Promise.resolve(); } return req(tx("blobs", "readwrite").put(b, id)); },
    getBlob: function (id) { if (!db) return Promise.resolve(mem.blobs[id] || null); return req(tx("blobs").get(id)).then(function (b) { return b || null; }).catch(function () { return null; }); },
    getMeta: function (k) { if (!db) return Promise.resolve(mem[k] || null); return req(tx("meta").get(k)).then(function (x) { return x || null; }).catch(function () { return null; }); },
    putMeta: function (k, v) { if (!db) { mem[k] = v; return Promise.resolve(); } return req(tx("meta", "readwrite").put(v, k)).catch(function () {}); },
    delMeta: function (k) { if (!db) { delete mem[k]; return Promise.resolve(); } return req(tx("meta", "readwrite").delete(k)).catch(function () {}); },

var C = { db: null, uid: null, assets: null, downloads: null, path: null, ready: false, claudeName: "" };

    v.shop = g.shop; v.type = g.type; v.area = g.area; v.date = g.date; touch(v); sortVisits(); S.editDetails = false; renderVisit();
  }
  else if (act === "delete") { S.confirmDelete = true; renderVisit(); window.scrollTo(0, document.body.scrollHeight); }
  else if (act === "delete-no") { S.confirmDelete = false; renderVisit(); }
  else if (act === "delete-yes") {
    var id = v.id;
    for (var i = 0; i < v.photos.length; i++) { var p = v.photos[i]; store.delBlob(p.id); if (p.assetId && C.assets) { try { await C.assets.delete(p.assetId); } catch (er) {} } }
    S.visits = S.visits.filter(function (x) { return x.id !== id; }); await store.del(id);
    if (C.db) { try { await C.db.collection(C.path).doc("visit_" + id).delete(); } catch (er) {} }
    S.confirmDelete = false; renderHome(); toast("Visit deleted");
  }
  else if (act === "cam") { pendingItem = b.closest(".item").getAttribute("data-id"); $("#file").click(); }
  else if (act === "photo") showPhoto(b.getAttribute("data-pid"));
  else if (act === "export") { renderExport(); window.scrollTo(0, 0); }
  else if (act === "reset-dest") { setDest(""); store.delMeta("dir"); toast("You will be asked where to save next time."); if (S.view === "export") renderExport(); else renderHome(); }
  else if (act === "xl-make") buildExport();
  else if (act === "xl-save") { if (S.ex.file) saveFile(S.ex.file.name, S.ex.file.blob); }
  else if (act === "xl-share") { if (S.ex.file) shareFile(S.ex.file); }
  else if (act === "dl-csv") {
    var vs2 = chosen(); if (!vs2.length) { toast("Pick at least one visit"); return; }
    saveFile("Sailor_Thailand_Notes_" + slug(S.profile.name) + ".csv", buildCsv(vs2));
  }
  else if (act === "share") openShare(b.getAttribute("data-id"));
  else if (act === "save-visit") {
    v.finished = true; touch(v); flushSaves(); S.formOpen = false; S.editProfile = false;
    renderHome(); window.scrollTo(0, 0); toast("Visit saved. Ready for the next one.");
  }
});
$("#hdr").addEventListener("click", function (e) { var b = e.target.closest('[data-act="home"]'); if (b) { flushSaves(); renderHome(); } });
$("#app").addEventListener("change", function (e) {
  var t = e.target, v = S.cur;
  if (t.matches('.item input[type=checkbox]')) {
    var it = t.closest(".item"), id = it.getAttribute("data-id");
    if (t.checked) v.checks[id] = 1; else delete v.checks[id];
    it.classList.toggle("on", t.checked); touch(v); updateProgress();
  } else if (t.matches("[data-vid]")) { S.ex.sel[t.getAttribute("data-vid")] = t.checked; S.ex.file = null; renderExport(); }
  else if (t.name === "mode") { S.ex.mode = t.value; S.ex.file = null; renderExport(); }
});
$("#app").addEventListener("input", function (e) {
  var t = e.target;
  if (t.matches(".noterow textarea")) {
    var id = t.closest(".item").getAttribute("data-id"), val = t.value;
    if (val.trim()) S.cur.notes[id] = val; else delete S.cur.notes[id];
    grow(t); touch(S.cur);
  }
});
$("#app").addEventListener("toggle", function (e) {
  var d = e.target; if (!d.matches || !d.matches("details.sec")) return;
  var id = d.getAttribute("data-sec");
  if (d.open) { S.open[id] = 1; $$("textarea", d).forEach(grow); } else delete S.open[id];
}, true);
$("#viewer").addEventListener("click", async function (e) {
  var b = e.target.closest("[data-act]"); if (!b) return;
  var act = b.getAttribute("data-act"), v = S.cur, pid = b.getAttribute("data-pid");
  if (act === "photo-close") { $("#viewer").hidden = true; }
  else if (act === "photo-save") {
    var p = v.photos.filter(function (x) { return x.id === pid; })[0], blob = p && await photoBlob(p);
    if (blob) { var rs = await download(slug(v.shop) + "_" + (p.item || "photo") + "_" + pid.slice(-4) + ".jpg", blob); if (rs === "unavailable") toast("Saving files is blocked in this view. Long-press the photo to save it."); } else toast("Photo file not available");
  }
  else if (act === "photo-del") {
    if (b.getAttribute("data-sure") !== "1") { b.setAttribute("data-sure", "1"); b.textContent = "Tap again to delete"; return; }
    var q = v.photos.filter(function (x) { return x.id === pid; })[0]; if (!q) return;
    v.photos = v.photos.filter(function (x) { return x.id !== pid; }); store.delBlob(pid); delete S.urls[pid];
    if (q.assetId && C.assets) { try { await C.assets.delete(q.assetId); } catch (er) {} }
    $("#viewer").hidden = true; renderThumbs(q.item); touch(v); toast("Photo deleted");
  }
});

$("#sheet").addEventListener("click", async function (e) {
  var sh = $("#sheet"), b = e.target.closest("[data-act]");
  if (e.target === sh && sh.querySelector("#sh-text")) { sh.hidden = true; sh.innerHTML = ""; return; }
  if (!b) return;
  var act = b.getAttribute("data-act"), id = sh.getAttribute("data-vid");
  if (act === "sh-close") { sh.hidden = true; sh.innerHTML = ""; }
  else if (act === "sh-copy") { var ok = await copyText($("#sh-text").value); if (!ok) { $("#sh-text").select(); } toast(ok ? "Summary copied" : "Select the text and copy it"); }
  else if (act === "sh-xshare" && shState && shState.blob) shareFile({ blob: shState.blob, name: shState.name }, $("#sh-msg"));
  else if (act === "sh-xsave" && shState && shState.blob) {
    var v = S.visits.filter(function (x) { return x.id === id; })[0], keepId = id;
    sh.hidden = true; sh.innerHTML = "";
    await saveFile(shState.name, shState.blob);
  }
  else if (act === "sh-retry") openShare(id);
});

/* ---------- start ---------- */
(async function () {
  await store.init();
  S.visits = (await store.all()).map(function (v) { v.photos = v.photos || []; v.checks = v.checks || {}; v.notes = v.notes || {}; return v; });
  sortVisits();
  renderHome();
  initCloud();
  loadExcelJS().catch(function () {});
})();
</script>
